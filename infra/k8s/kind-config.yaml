# Cluster local kind para desenvolvimento e testes de integração.
#   kind create cluster --config infra/k8s/kind-config.yaml
#   kind load docker-image acme/homefinance-api:dev --name homefinance

kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: homefinance

nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # Api
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
  - role: worker
