global:
  scrape_interval: 15s
  evaluation_interval: 15s

# As métricas da aplicação chegam por push OTLP (via collector), não por scrape.
# O scrape abaixo cobre apenas a saúde da própria stack de observabilidade.
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

storage:
  tsdb:
    out_of_order_time_window: 30m
