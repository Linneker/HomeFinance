apiVersion: 1

# Carrega os dashboards versionados em infra/observability/grafana/dashboards, montados no
# container em /var/lib/grafana/dashboards. Assim a saúde do serviço nasce provisionada, não
# depende de alguém importar à mão depois de subir a stack.
providers:
  - name: HomeFinance
    orgId: 1
    folder: HomeFinance
    type: file
    disableDeletion: false
    allowUiUpdates: true
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
