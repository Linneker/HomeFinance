# Config mínima do Tempo para a stack local.
# Os blocos de tuning de ingester/compactor foram deixados de fora de propósito: o schema
# aceito varia entre versões da imagem e os defaults atendem o volume de desenvolvimento.

stream_over_http_enabled: true

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
